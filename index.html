<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えシステム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f5f0e8;
    --paper: #fffef9;
    --ink: #1a1410;
    --accent: #c0392b;
    --accent2: #2c6e49;
    --blue: #2563eb;
    --muted: #8a7f72;
    --border: #c8bfb0;
    --desk-empty: #e8e0d4;
    --desk-filled: #fff;
    --shadow: rgba(26,20,16,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 60px;
    user-select: none;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 900; letter-spacing: .08em;
    position: relative; display: inline-block;
  }
  header h1::after {
    content: ''; display: block; height: 3px;
    background: var(--accent); margin-top: 4px; border-radius: 2px;
  }
  header p { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ── レイアウト設定 ── */
  .layout-bar {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 14px 20px;
    margin: 0 auto 20px;
    max-width: 560px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .field {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700;
  }
  .field input[type=number] {
    font-family: 'DM Mono', monospace;
    font-size: 15px; width: 64px; padding: 5px 8px;
    border: 2px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--ink); text-align: center;
    transition: border-color .15s;
  }
  .field input[type=number]:focus { outline: none; border-color: var(--ink); }
  .layout-hint { font-size: 11px; color: var(--muted); width: 100%; text-align: center; }

  /* ── ツールバー ── */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 20px;
  }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: .05em; padding: 8px 18px; border-radius: 4px;
    border: 2px solid var(--ink); cursor: pointer;
    transition: all .15s; background: var(--paper); color: var(--ink);
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.danger  { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover  { background: var(--accent); color: #fff; }
  .btn.success { border-color: var(--accent2); color: var(--accent2); }
  .btn.success:hover { background: var(--accent2); color: #fff; }
  .btn.primary { border-color: var(--blue); color: var(--blue); }
  .btn.primary:hover { background: var(--blue); color: #fff; }

  /* ── 教室 ── */
  .classroom-wrap { overflow-x: auto; padding-bottom: 8px; }
  .blackboard {
    background: var(--ink); color: var(--paper);
    text-align: center; font-size: 12px; font-weight: 700;
    letter-spacing: .2em; padding: 6px; border-radius: 2px;
    margin: 0 auto 10px;
  }

  /* グリッドレイアウト */
  .classroom {
    display: grid;
    margin: 0 auto;
    /* grid-template-columns は JS で設定 */
  }

  /* ── セル（全グリッド枠） ── */
  .cell {
    width: 82px; height: 68px;
    position: relative;
  }

  /* ── 空きセル：透明だがドロップ可 ── */
  .cell.empty-cell {
    /* 完全透明 */
  }
  /* ドラッグ中だけ空きセルをうっすら表示 */
  .dragging-active .cell.empty-cell {
    border: 2px dashed transparent;
    border-radius: 4px;
    background: transparent;
    transition: background .1s, border-color .1s;
  }
  .dragging-active .cell.empty-cell.drop-hover {
    border-color: var(--accent2);
    background: rgba(44,110,73,.08);
  }

  /* ── 机 ── */
  .desk {
    position: absolute;
    inset: 0;
    background: var(--desk-empty);
    border: 2px solid var(--border);
    border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: grab;
    touch-action: none;
    transition: border-color .1s, box-shadow .1s, background .1s;
    z-index: 1;
  }
  .desk:hover { border-color: var(--ink); box-shadow: 3px 3px 0 var(--shadow); }
  .desk.filled { background: var(--desk-filled); border-color: var(--ink); }

  /* ドラッグ中のゴースト（元の位置） */
  .desk.drag-ghost {
    opacity: 0;
    pointer-events: none;
  }

  /* 飛んでいる机（body直下に追加） */
  .desk-floating {
    position: fixed;
    width: 82px; height: 68px;
    background: var(--desk-filled);
    border: 2px dashed var(--accent2);
    border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 9999;
    opacity: .9;
    box-shadow: 6px 6px 0 var(--shadow);
  }
  .desk-floating .num-badge {
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--muted); position: absolute; top: 4px; left: 6px;
  }
  .desk-floating .name {
    font-size: 13px; font-weight: 700; text-align: center;
    padding: 0 4px; word-break: break-all; line-height: 1.3;
  }
  .desk-floating .empty-hint { font-size: 11px; color: var(--border); }

  .desk .num-badge {
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--muted); position: absolute; top: 4px; left: 6px;
    pointer-events: none;
  }
  .desk .name {
    font-size: 13px; font-weight: 700; text-align: center;
    padding: 0 4px; word-break: break-all; line-height: 1.3;
    pointer-events: none;
  }
  .desk .empty-hint { font-size: 11px; color: var(--border); pointer-events: none; }
  .desk.highlight { animation: pulse .5s ease; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(192,57,43,.5); }
    100% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
  }

  /* ── モーダル ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,20,16,.45); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper); border: 2px solid var(--ink);
    border-radius: 6px; padding: 28px 28px 22px;
    width: min(340px, 90vw);
    box-shadow: 6px 6px 0 var(--shadow); animation: slideIn .2s ease;
  }
  .confirm-modal {
    background: var(--paper); border: 2px solid var(--accent);
    border-radius: 6px; padding: 24px; width: min(340px, 90vw);
    box-shadow: 6px 6px 0 var(--shadow); animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { transform: translateY(-16px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }
  .modal h2 { font-size: 16px; font-weight: 900; margin-bottom: 16px; }
  .confirm-modal p { font-size: 14px; line-height: 1.7; margin-bottom: 18px; white-space: pre-wrap; }
  .modal label { font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; color: var(--muted); }
  .modal input[type=number] {
    font-family: inherit; font-size: 15px; width: 100%;
    padding: 8px 10px; border: 2px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--ink); margin-bottom: 14px;
    transition: border-color .15s;
  }
  .modal input:focus { outline: none; border-color: var(--ink); }
  .modal .preview {
    font-size: 13px; min-height: 20px; margin-bottom: 14px;
    padding: 6px 10px; background: var(--bg); border-radius: 4px;
    border: 1px dashed var(--border); color: var(--accent2); font-weight: 700;
  }
  .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  /* ── 名簿パネル ── */
  .panel {
    display: none; position: fixed; top: 0; right: 0;
    width: min(320px, 100vw); height: 100vh;
    background: var(--paper); border-left: 2px solid var(--ink);
    z-index: 1100; flex-direction: column;
    box-shadow: -4px 0 16px var(--shadow); animation: slideR .2s ease;
  }
  @keyframes slideR {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  .panel.open { display: flex; }
  .panel-header {
    padding: 18px 16px 12px; border-bottom: 2px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header h2 { font-size: 15px; font-weight: 900; }
  .panel-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .panel textarea {
    font-family: 'DM Mono', monospace; font-size: 12px; width: 100%;
    height: calc(100vh - 220px); border: 2px solid var(--border);
    border-radius: 4px; background: var(--bg); color: var(--ink); padding: 10px; resize: vertical;
  }
  .panel textarea:focus { outline: none; border-color: var(--ink); }
  .panel-hint { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.6; }
  .panel-footer { padding: 12px 16px; border-top: 2px solid var(--border); display: flex; gap: 8px; }

  .stats { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
  .stats span { color: var(--ink); font-weight: 700; }
  .drag-hint { text-align: center; font-size: 11px; color: var(--border); margin-top: 8px; }

  @media print {
    body { background: #fff; padding: 8px; }
    .toolbar, .layout-bar, .modal-overlay, .panel, .drag-hint, .stats { display: none !important; }
    header p { display: none; }
    .cell.empty-cell { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🪑 席替えシステム</h1>
  <p>クリック → 番号入力 ／ ドラッグ → 空きスペースに自由移動</p>
</header>

<div class="layout-bar">
  <div class="field">
    <label for="inp-people">👥 人数</label>
    <input type="number" id="inp-people" min="1" max="100" value="28">
    <span>人</span>
  </div>
  <div class="field">
    <label for="inp-cols">📐 列数</label>
    <input type="number" id="inp-cols" min="1" max="20" value="8">
    <span>列</span>
  </div>
  <button class="btn primary" onclick="applyLayout()">🔄 配置を更新</button>
  <div class="layout-hint" id="layout-hint"></div>
</div>

<div class="toolbar">
  <button class="btn success" onclick="openPanel()">📋 名簿を編集</button>
  <button class="btn" onclick="window.print()">🖨 印刷</button>
  <button class="btn danger" onclick="confirmReset()">🗑 席をリセット</button>
</div>

<div class="classroom-wrap">
  <div class="blackboard" id="blackboard">― 黒 板 ―</div>
  <div class="classroom" id="classroom"></div>
</div>

<div class="drag-hint">💡 机をドラッグして空きスペースに移動できます</div>
<div class="stats" id="stats"></div>

<!-- 番号入力モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">番号を入力</h2>
    <label>出席番号</label>
    <input type="number" id="num-input" min="1" placeholder="例: 12" oninput="previewName()">
    <label>名前（確認）</label>
    <div class="preview" id="name-preview">—</div>
    <div class="modal-buttons">
      <button class="btn danger" onclick="clearSeat()">クリア</button>
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn success" onclick="confirmSeat()">決定</button>
    </div>
  </div>
</div>

<!-- 配置変更確認 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="confirm-modal">
    <p id="confirm-text"></p>
    <div class="modal-buttons">
      <button class="btn" onclick="closeConfirm()">キャンセル</button>
      <button class="btn primary" onclick="doApplyLayout(false)">割り当てを保持</button>
      <button class="btn danger" onclick="doApplyLayout(true)">割り当てもリセット</button>
    </div>
  </div>
</div>

<!-- 名簿パネル -->
<div class="panel" id="panel">
  <div class="panel-header">
    <h2>📋 名簿（番号 → 名前）</h2>
    <button class="panel-close" onclick="closePanel()">×</button>
  </div>
  <div class="panel-body">
    <p class="panel-hint">
      1行につき「番号,名前」の形式で入力してください。<br>
      例: <b>1,山田太郎</b><br>
      Excelからコピペも可能です（タブ区切り対応）。
    </p>
    <textarea id="roster-input" placeholder="1,山田太郎&#10;2,鈴木花子&#10;3,田中次郎&#10;..."></textarea>
  </div>
  <div class="panel-footer">
    <button class="btn success" style="flex:1" onclick="saveRoster()">保存する</button>
    <button class="btn" onclick="closePanel()">閉じる</button>
  </div>
</div>

<script>
// ── 定数 ──
const DESK_W = 82, DESK_H = 68, GAP = 8;

// ── 状態 ──
// grid[r][c] = { hasSeat: bool, num: int|null }
let grid   = [];   // 2Dグリッド
let roster = {};
let config = { people: 28, cols: 8 };
let currentCell = null; // { r, c }
let pendingLayout = null;

// ── 計算 ──
function calcRows(people, cols) { return Math.ceil(people / cols); }

// 初期配置：基本行 + 端数は中央
function defaultGrid(people, cols) {
  const rows     = calcRows(people, cols);
  const baseRows = Math.floor(people / cols);
  const rem      = people % cols;
  const g = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ hasSeat: false, num: null }))
  );
  for (let r = 0; r < baseRows; r++)
    for (let c = 0; c < cols; c++)
      g[r][c].hasSeat = true;
  if (rem > 0) {
    const startCol = Math.floor((cols - rem) / 2);
    for (let i = 0; i < rem; i++)
      g[baseRows][startCol + i].hasSeat = true;
  }
  return g;
}

// ── 初期化 ──
function init() {
  loadRoster();
  loadConfig();
  loadGrid();
  buildGrid();
  updateHint();
  updateStats();
}

// ── レイアウト更新 ──
function applyLayout() {
  const people = parseInt(document.getElementById('inp-people').value);
  const cols   = parseInt(document.getElementById('inp-cols').value);
  if (isNaN(people) || people < 1 || isNaN(cols) || cols < 1) return;
  if (cols > people) { alert('列数は人数以下にしてください'); return; }
  pendingLayout = { people, cols };
  const hasAssigned = grid.some(row => row.some(c => c.num !== null));
  if (hasAssigned && (people !== config.people || cols !== config.cols)) {
    document.getElementById('confirm-text').textContent =
      `レイアウトを「${people}人・${cols}列」に変更します。\n現在の席の割り当てはどうしますか？`;
    document.getElementById('confirm-modal').classList.add('open');
  } else {
    doApplyLayout(false);
  }
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
  pendingLayout = null;
}
function doApplyLayout(resetNums) {
  if (!pendingLayout) return;
  document.getElementById('confirm-modal').classList.remove('open');
  const { people, cols } = pendingLayout;
  pendingLayout = null;

  // 既存の番号を順番に収集
  const oldNums = resetNums ? [] : collectNums();

  config = { people, cols };
  grid = defaultGrid(people, cols);

  // 番号を復元（席がある位置に順番に）
  if (!resetNums) {
    const seats = listSeats();
    oldNums.forEach((n, i) => { if (i < seats.length) seats[i].num = n; });
  }

  saveConfig(); saveGrid();
  buildGrid(); updateHint(); updateStats();
}

// 番号が入った席を順番に収集
function collectNums() {
  const nums = [];
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c].hasSeat && grid[r][c].num !== null)
        nums.push(grid[r][c].num);
  return nums;
}

// 席があるセルを行列順に返す
function listSeats() {
  const seats = [];
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c].hasSeat) seats.push(grid[r][c]);
  return seats;
}

// ── グリッド描画 ──
function buildGrid() {
  const classroom = document.getElementById('classroom');
  classroom.innerHTML = '';
  const cols = config.cols;
  const rows = grid.length;
  const w = cols * DESK_W + (cols - 1) * GAP;
  classroom.style.gridTemplateColumns = `repeat(${cols}, ${DESK_W}px)`;
  classroom.style.gap = GAP + 'px';
  classroom.style.width = w + 'px';
  document.getElementById('blackboard').style.cssText += `width:${w}px;max-width:none;`;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (grid[r][c].hasSeat) {
        const desk = makeDeskEl(r, c);
        cell.appendChild(desk);
      } else {
        cell.classList.add('empty-cell');
        setupDropCell(cell, r, c);
      }
      classroom.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

// ── 机要素生成 ──
function makeDeskEl(r, c) {
  const desk = document.createElement('div');
  desk.className = 'desk';
  refreshDeskContent(desk, grid[r][c]);
  setupDeskInteraction(desk, r, c);
  return desk;
}

function refreshDeskContent(desk, cellData) {
  desk.innerHTML = '';
  if (cellData.num !== null) {
    desk.classList.add('filled');
    const b = document.createElement('div'); b.className = 'num-badge'; b.textContent = '#' + cellData.num;
    const n = document.createElement('div'); n.className = 'name';
    n.textContent = roster[String(cellData.num)] || '番号' + cellData.num;
    desk.append(b, n);
  } else {
    desk.classList.remove('filled');
    const h = document.createElement('div'); h.className = 'empty-hint'; h.textContent = '空席';
    desk.appendChild(h);
  }
}

function refreshCellDesk(r, c) {
  const cell = getCell(r, c);
  if (!cell) return;
  const desk = cell.querySelector('.desk');
  if (desk) refreshDeskContent(desk, grid[r][c]);
}

// ── ドラッグ操作 ──
function setupDeskInteraction(desk, r, c) {
  let startX, startY, dragging = false, floating = null;

  function onStart(cx, cy) {
    dragging = false;
    desk._dragged = false;
    startX = cx; startY = cy;
  }

  function onMove(cx, cy) {
    const dx = cx - startX, dy = cy - startY;
    if (!dragging && Math.hypot(dx, dy) > 6) {
      dragging = true;
      desk._dragged = true;
      desk.classList.add('drag-ghost');
      document.getElementById('classroom').classList.add('dragging-active');

      // フローティング要素を作成
      floating = document.createElement('div');
      floating.className = 'desk-floating';
      floating.innerHTML = desk.innerHTML;
      document.body.appendChild(floating);
    }
    if (!dragging) return;

    floating.style.left = (cx - DESK_W / 2) + 'px';
    floating.style.top  = (cy - DESK_H / 2) + 'px';

    // ドロップ候補をハイライト
    document.querySelectorAll('.empty-cell.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    const target = getDropTarget(cx, cy);
    if (target) target.classList.add('drop-hover');
  }

  function onEnd(cx, cy) {
    if (!dragging) return;

    desk.classList.remove('drag-ghost');
    document.getElementById('classroom').classList.remove('dragging-active');
    document.querySelectorAll('.empty-cell.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    if (floating) { floating.remove(); floating = null; }

    const target = getDropTarget(cx, cy);
    if (target) {
      const tr = parseInt(target.dataset.r), tc = parseInt(target.dataset.c);
      // grid 更新：席を移動
      grid[tr][tc] = { hasSeat: true, num: grid[r][c].num };
      grid[r][c]   = { hasSeat: false, num: null };

      // DOM更新：元セルを空に、先セルに机を追加
      const origCell = getCell(r, c);
      origCell.innerHTML = '';
      origCell.classList.add('empty-cell');
      setupDropCell(origCell, r, c);

      target.classList.remove('empty-cell');
      const newDesk = makeDeskEl(tr, tc);
      target.appendChild(newDesk);

      // r, c を新しい位置に更新
      r = tr; c = tc;

      saveGrid(); updateStats();
    }

    dragging = false;
  }

  desk.addEventListener('mousedown', e => {
    if (e.button !== 0) return; e.preventDefault(); onStart(e.clientX, e.clientY);
    const mm = e2 => onMove(e2.clientX, e2.clientY);
    const mu = e2 => { onEnd(e2.clientX, e2.clientY); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
  desk.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
  desk.addEventListener('touchmove',  e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); if (dragging) e.preventDefault(); }, { passive: false });
  desk.addEventListener('touchend',   e => { const t = e.changedTouches[0]; onEnd(t.clientX, t.clientY); });

  desk.addEventListener('click', () => {
    if (desk._dragged) { desk._dragged = false; return; }
    openModal(r, c);
  });
}

// 空きセルへのドロップ設定
function setupDropCell(cell, r, c) {
  cell.dataset.r = r;
  cell.dataset.c = c;
}

// カーソル位置から最寄りの空きセルを取得
function getDropTarget(cx, cy) {
  const cells = document.querySelectorAll('.cell.empty-cell');
  let best = null, bestD = Infinity;
  cells.forEach(cell => {
    const rect = cell.getBoundingClientRect();
    const mx = rect.left + rect.width / 2;
    const my = rect.top  + rect.height / 2;
    const d  = Math.hypot(cx - mx, cy - my);
    if (d < (DESK_W * 0.8) && d < bestD) { bestD = d; best = cell; }
  });
  return best;
}

// ── モーダル ──
function openModal(r, c) {
  currentCell = { r, c };
  const cellData = grid[r][c];
  document.getElementById('modal-title').textContent =
    `席（${cellData.num !== null ? '#' + cellData.num + ' ' + (roster[String(cellData.num)] || '') : '空席'}）`;
  const inp = document.getElementById('num-input');
  inp.max   = config.people;
  inp.value = cellData.num !== null ? cellData.num : '';
  previewName();
  document.getElementById('modal').classList.add('open');
  setTimeout(() => inp.focus(), 50);
  inp.onkeydown = e => { if (e.key === 'Enter') confirmSeat(); if (e.key === 'Escape') closeModal(); };
}
function closeModal() { document.getElementById('modal').classList.remove('open'); currentCell = null; }

function previewName() {
  const val  = document.getElementById('num-input').value.trim();
  const prev = document.getElementById('name-preview');
  if (!val) { prev.textContent = '—'; return; }
  const n = parseInt(val);
  if (isNaN(n) || n < 1 || n > config.people) { prev.textContent = `⚠ 1〜${config.people}の番号を入力`; return; }
  // 重複チェック
  const dup = findCellWithNum(n);
  if (dup && !(dup.r === currentCell.r && dup.c === currentCell.c)) {
    prev.textContent = `⚠ #${n} はすでに別の席に配置済み`; return;
  }
  prev.textContent = roster[String(n)] ? `#${n} ${roster[String(n)]}` : `#${n}（名前未登録）`;
}

function findCellWithNum(n) {
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c].num === n) return { r, c };
  return null;
}

function confirmSeat() {
  const val = document.getElementById('num-input').value.trim();
  if (!val) { clearSeat(); return; }
  const n = parseInt(val);
  if (isNaN(n) || n < 1 || n > config.people) return;
  const dup = findCellWithNum(n);
  if (dup && !(dup.r === currentCell.r && dup.c === currentCell.c)) return;
  grid[currentCell.r][currentCell.c].num = n;
  refreshCellDesk(currentCell.r, currentCell.c);
  const cell = getCell(currentCell.r, currentCell.c);
  const desk = cell?.querySelector('.desk');
  if (desk) { desk.classList.remove('highlight'); void desk.offsetWidth; desk.classList.add('highlight'); }
  saveGrid(); updateStats(); closeModal();
}

function clearSeat() {
  if (!currentCell) return;
  grid[currentCell.r][currentCell.c].num = null;
  refreshCellDesk(currentCell.r, currentCell.c);
  saveGrid(); updateStats(); closeModal();
}

// ── 名簿 ──
function openPanel() {
  document.getElementById('roster-input').value =
    Object.keys(roster).sort((a,b) => +a - +b).map(k => `${k},${roster[k]}`).join('\n');
  document.getElementById('panel').classList.add('open');
}
function closePanel() { document.getElementById('panel').classList.remove('open'); }
function saveRoster() {
  const r = {};
  document.getElementById('roster-input').value.split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    const sep = line.includes('\t') ? '\t' : ',';
    const i = line.indexOf(sep); if (i < 1) return;
    const num = line.slice(0,i).trim(), name = line.slice(i+1).trim();
    if (num && name) r[num] = name;
  });
  roster = r;
  localStorage.setItem('roster_v1', JSON.stringify(roster));
  // 全机を再描画
  for (let r2 = 0; r2 < grid.length; r2++)
    for (let c = 0; c < grid[r2].length; c++)
      if (grid[r2][c].hasSeat) refreshCellDesk(r2, c);
  updateStats(); closePanel();
}

// ── 統計 ──
function updateStats() {
  const total  = grid.flat().filter(c => c.hasSeat).length;
  const filled = grid.flat().filter(c => c.hasSeat && c.num !== null).length;
  document.getElementById('stats').innerHTML = `着席: <span>${filled}</span> / <span>${total}</span> 席`;
}

function updateHint() {
  const rows = calcRows(config.people, config.cols);
  const rem  = config.people % config.cols;
  document.getElementById('layout-hint').textContent =
    rem === 0
      ? `${config.cols}列 × ${rows}行 = ${config.people}席`
      : `${config.cols}列 × ${rows}行のグリッド（${config.people}席 ＋ 空き${config.cols * rows - config.people}枠）`;
  document.getElementById('inp-people').value = config.people;
  document.getElementById('inp-cols').value   = config.cols;
}

// ── リセット ──
function confirmReset() {
  if (!confirm('全ての席の割り当てをリセットしますか？\n（名簿・並び順はそのまま保持されます）')) return;
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      grid[r][c].num = null;
  buildGrid(); updateStats();
  saveGrid();
}

// ── ストレージ ──
function saveConfig() {
  localStorage.setItem('layout_config_v3', JSON.stringify(config));
}
function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem('layout_config_v3') || 'null');
    if (c?.people && c?.cols) config = c;
  } catch(e) {}
}
function saveGrid() {
  // hasSeat と num だけ保存
  const data = grid.map(row => row.map(c => ({ h: c.hasSeat ? 1 : 0, n: c.num })));
  localStorage.setItem('grid_v1', JSON.stringify(data));
}
function loadGrid() {
  // まずデフォルトで生成
  grid = defaultGrid(config.people, config.cols);
  try {
    const saved = JSON.parse(localStorage.getItem('grid_v1') || 'null');
    if (saved && saved.length === grid.length && saved[0].length === grid[0].length) {
      for (let r = 0; r < grid.length; r++)
        for (let c = 0; c < grid[r].length; c++) {
          grid[r][c].hasSeat = saved[r][c].h === 1;
          grid[r][c].num     = saved[r][c].n ?? null;
        }
    }
  } catch(e) {}
}
function loadRoster() {
  try { roster = JSON.parse(localStorage.getItem('roster_v1') || '{}'); } catch(e) { roster = {}; }
}

// ── イベント ──
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.getElementById('confirm-modal').addEventListener('click', e => { if (e.target.id === 'confirm-modal') closeConfirm(); });
['inp-people','inp-cols'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') applyLayout(); });
});

init();
</script>
</body>
